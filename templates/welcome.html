{% extends "auth_base.html" %}
{% block title %}Welcome{% endblock %}

{% block content %}
<div class="login-card">
  <div class="text-center mb-4">
    <div class="login-card__icon login-card__icon--danger mx-auto mb-3">
      <i class="bi bi-shield-fill-exclamation"></i>
    </div>
    <h1 class="page-title text-white mb-1">GourSafe</h1>
    <p class="page-subtitle mb-0">Dr. Harisingh Gour Vishwavidyalaya, Sagar</p>
  </div>

  <div class="d-grid gap-2">
    <a href="{{ url_for('signup') }}" class="btn btn-danger py-2 fw-bold">
      <i class="bi bi-person-plus-fill me-2"></i>Sign Up
    </a>
    <a href="{{ url_for('login') }}" class="btn btn-outline-danger py-2 fw-bold">
      <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
    </a>
    <a href="{{ url_for('guest_login') }}" class="btn btn-link text-muted py-2 text-decoration-none">
      Continue as Guest
    </a>
  </div>

  <p class="text-center text-muted small mt-4 mb-0">
    <i class="bi bi-info-circle me-1"></i>Signing up lets you save an
    emergency contact that's shared with campus security if you ever hit SOS.
  </p>
</div>
{% endblock %}
