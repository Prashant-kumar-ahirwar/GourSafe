{% extends "auth_base.html" %}
{% block title %}Sign In{% endblock %}

{% block content %}
<div class="login-card">
  <div class="text-center mb-4">
    <div class="login-card__icon login-card__icon--danger mx-auto mb-3">
      <i class="bi bi-box-arrow-in-right"></i>
    </div>
    <h1 class="page-title text-white mb-1">Sign In</h1>
    <p class="page-subtitle mb-0">Welcome back to GourSafe</p>
  </div>

  {% if error %}
  <div class="alert alert-danger d-flex align-items-center gap-2 py-2" role="alert">
    <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
    <span class="small">{{ error }}</span>
  </div>
  {% endif %}

  <form method="POST" action="{{ url_for('login') }}">
    <div class="mb-3">
      <label for="email" class="form-label small text-muted">Email</label>
      <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" required autofocus />
    </div>
    <div class="mb-4">
      <label for="password" class="form-label small text-muted">Password</label>
      <input type="password" class="form-control" id="password" name="password" required />
    </div>
    <button type="submit" class="btn btn-danger w-100 py-2 fw-bold">Sign In</button>
  </form>

  <p class="text-center text-muted small mt-4 mb-0">
    New here? <a href="{{ url_for('signup') }}" class="link-light">Create an account</a>
  </p>
  <p class="text-center mt-2 mb-0">
    <a href="{{ url_for('guest_login') }}" class="text-muted small">Continue as Guest instead</a>
  </p>
</div>
{% endblock %}
