<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1220" />
  <title>{% block title %}Operator Console{% endblock %} — GourSafe</title>

  <!-- Same early theme-detection as the student app -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('goursafe-theme') || 'light';
        document.documentElement.setAttribute('data-bs-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-bs-theme', 'light');
      }
    })();
  </script>

  <!-- Bootstrap 5 CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />
  <!-- Shared site styles (operator-specific rules are appended at the bottom) -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=13" />
  {% block head_extra %}{% endblock %}
</head>
<body class="operator-shell">

  <!-- ── Operator top bar — deliberately different from the student navbar
       (slate/blue instead of red) so the two interfaces never look like
       the same app by accident ── -->
  <nav class="navbar navbar-dark operator-navbar sticky-top shadow-sm">
    <div class="container-fluid px-3">
      <span class="navbar-brand fw-bold d-flex align-items-center gap-2 mb-0">
        <i class="bi bi-hdd-network-fill fs-5"></i>
        <span class="d-flex flex-column lh-sm">
          <span>GourSafe Operator Console</span>
          <span class="fw-normal" style="font-size:0.62rem;opacity:0.75;">Dr. Harisingh Gour Vishwavidyalaya, Sagar</span>
        </span>
      </span>

      {% if session.get('operator_authenticated') %}
      <div class="d-flex align-items-center gap-2">
        <span class="d-none d-sm-inline text-white-50 small">
          <i class="bi bi-person-badge me-1"></i>{{ session.get('operator_username') }}
        </span>
        <a href="{{ url_for('operator_logout') }}" class="btn btn-sm btn-outline-light">
          <i class="bi bi-box-arrow-right me-1"></i>Logout
        </a>
      </div>
      {% endif %}
    </div>
  </nav>

  <main class="container-fluid px-3 py-4 operator-main {% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  <!-- Bootstrap 5 JS bundle (includes Popper) -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmFXd10W/4Oj9HpI5SLnGGQx4sS"
    crossorigin="anonymous"
  ></script>

  {% block scripts %}{% endblock %}
</body>
</html>
