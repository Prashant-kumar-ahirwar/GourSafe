<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#c0392b" />
  <title>{% block title %}GourSafe{% endblock %}</title>

  <!-- Same early theme-detection as base.html, so a preference set on
       the student app also applies here (and vice versa). -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('goursafe-theme') || 'dark';
        document.documentElement.setAttribute('data-bs-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-bs-theme', 'dark');
      }
    })();
  </script>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="auth-shell">
  <main class="d-flex align-items-center justify-content-center px-3" style="min-height:100vh;">
    <div style="width:100%; max-width:380px;">
      {% block content %}{% endblock %}
    </div>
  </main>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmFXd10W/4Oj9HpI5SLnGGQx4sS"
    crossorigin="anonymous"
  ></script>
</body>
</html>
