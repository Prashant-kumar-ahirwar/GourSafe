{% extends "operator_base.html" %}
{% block title %}Staff Login{% endblock %}

{% block content %}
<div class="d-flex justify-content-center">
  <div class="login-card">

    <div class="text-center mb-4">
      <div class="login-card__icon mx-auto mb-3">
        <i class="bi bi-shield-lock-fill"></i>
      </div>
      <h1 class="page-title text-white mb-1">Operator Login</h1>
      <p class="page-subtitle mb-0">Staff access only — campus security &amp; IT operations.</p>
    </div>

    {% if error %}
    <div class="alert alert-danger d-flex align-items-center gap-2 py-2" role="alert">
      <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
      <span class="small">{{ error }}</span>
    </div>
    {% endif %}

    <form method="POST" action="{{ url_for('operator_login') }}">
      <input type="hidden" name="next" value="{{ next }}" />

      <div class="mb-3">
        <label for="username" class="form-label small text-muted">Username</label>
        <input
          type="text"
          class="form-control"
          id="username"
          name="username"
          autocomplete="username"
          required
          autofocus
        />
      </div>

      <div class="mb-4">
        <label for="password" class="form-label small text-muted">Password</label>
        <input
          type="password"
          class="form-control"
          id="password"
          name="password"
          autocomplete="current-password"
          required
        />
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
        <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
      </button>
    </form>

    <p class="text-center text-muted small mt-4 mb-0">
      <i class="bi bi-info-circle me-1"></i>Not staff? Go back to the
      <a href="{{ url_for('index') }}" class="link-light">student app</a>.
    </p>
  </div>
</div>
{% endblock %}
