<?xml version="1.0" encoding="UTF-8"?>
<!-- GourSafe app icon — TRANSPARENT backdrop variant for in-app use
     (navbar brand, favicon). Same geometry as goursafe-icon.svg minus
     the white sheet, so it sits cleanly on the red navbar. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="512" height="512" viewBox="0 0 512 512">

  <defs>
    <!-- Shield silhouette, also used as a clip so the pulse rings can
         never bleed past the shield's edges -->
    <path id="goursafe-shield"
          d="M256 76 L378 114 V238 C378 320 326 386 256 424
             C186 386 134 320 134 238 V114 Z"/>
    <clipPath id="goursafe-shield-clip">
      <use xlink:href="#goursafe-shield"/>
    </clipPath>
  </defs>

  <!-- Rounded-square app container, crimson red (no white backdrop) -->
  <rect x="26" y="26" width="460" height="460" rx="104" fill="#DC2626"/>

  <!-- Sleek white shield silhouette -->
  <use xlink:href="#goursafe-shield" fill="#FFFFFF"/>

  <!-- Glowing pulse: flat concentric rings emanating from the pin head,
     clipped inside the shield, drawn behind the pin for a clean halo -->
  <g clip-path="url(#goursafe-shield-clip)">
    <circle cx="256" cy="214" r="86" fill="#FEE2E2"/>
    <circle cx="256" cy="214" r="68" fill="none" stroke="#FCA5A5" stroke-width="8"/>
    <circle cx="256" cy="214" r="52" fill="none" stroke="#EF4444" stroke-width="8"/>
  </g>

  <!-- Location pin, centered on the shield -->
  <path d="M256 150
           C220.3 150 192 178.9 192 214
           C192 240.9 219.5 280.3 247.4 314.9
           C251.1 319.4 258.9 319.4 262.6 314.9
           C290.5 280.3 318 240.9 318 214
           C318 178.9 291.7 150 256 150 Z"
        fill="#DC2626"/>

  <!-- White eye + glowing pulse dot in the pin's center -->
  <circle cx="256" cy="214" r="26" fill="#FFFFFF"/>
  <circle cx="256" cy="214" r="14" fill="#EF4444"/>
</svg>
